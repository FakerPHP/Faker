on: # yamllint disable-line rule:truthy
  pull_request: ~
  push:
    branches:
      - "main"
      - "[0-9].*"

name: "BC Check"

jobs:
  roave-bc-check:
    name: "Roave BC Check"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v3"

      - name: "Roave BC Check"
        run: "docker run --rm --volume=${GITHUB_WORKSPACE}:/app nyholm/roave-bc-check:6.x"
